
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Dynamic AI</h2>
                <p>Powered by Llama 3.2</p>
            </div>

            <button id="new-chat-btn" class="new-chat-btn">
                + New Chat
            </button>

            <div class="sidebar-bottom">
                <p>Dynamic AI Chatbot</p>
                <small>B.Tech CSE Project</small>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">

            <header class="chat-header">
                <h2>Dynamic AI Chatbot</h2>
                <span class="status">● Local AI</span>
            </header>

            <!-- Messages -->
            <div id="chat-messages" class="chat-messages">
                <div class="welcome-screen">
                    <h1>Welcome to Dynamic AI</h1>
                    <p>
                        Your intelligent assistant powered by
                        Llama 3.2 and FastAPI.
                    </p>
                    <p>How can I help you today?</p>
                </div>
            </div>

            <!-- Message Input -->
            <div class="chat-input-container">
                <form id="chat-form">
                    <textarea
                        id="message-input"
                        placeholder="Ask me anything..."
                        rows="1"
                        maxlength="4000"
                        required
                    ></textarea>

                    <button
                        type="submit"
                        id="send-btn"
                        aria-label="Send message"
                    >
                        ➤
                    </button>
                </form>

                <p class="footer-text">
                    Powered by Ollama + Llama 3.2 |
                    FastAPI + PostgreSQL
                </p>
            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
